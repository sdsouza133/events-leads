[project]
name = "events-leads"
version = "0.1.0"
description = "Find the people going to your industry's events, filtered to your ICP, with verified emails."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "alembic>=1.13",
    "anthropic>=2.3,<3",
    "beautifulsoup4>=4.12",
    "fastapi>=0.115",
    "httpx2>=1.0",
    "jinja2>=3.1",
    "psycopg[binary]>=3.2",
    "pydantic>=2.8",
    "pydantic-settings>=2.7",  # NoDecode
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0.30",
    "tldextract>=5.1",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pre-commit>=3.8",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # import order
    "B",        # bugbear
    "UP",       # pyupgrade
    "S",        # bandit security checks
    "SIM",      # simplifications
    "C4",       # comprehensions
    "DTZ",      # timezone-aware datetimes
    "PT",       # pytest style
    "RET",      # return statements
    "ARG",      # unused arguments
    "N",        # naming
    "PL",       # pylint
    "RUF",      # ruff-specific
]
ignore = [
    "PLR0913",  # FastAPI routes and settings legitimately take many arguments
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311", "PLR2004", "ARG001"]
"migrations/**" = ["N999"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
exclude = ["migrations/versions/"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "db: needs a Postgres database (DATABASE_URL); skipped when none is reachable",
]
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
