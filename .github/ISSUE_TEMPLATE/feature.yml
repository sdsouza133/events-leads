name: Feature
description: Something the product should do that it doesn't yet
labels: [enhancement]
body:
  - type: textarea
    id: story
    attributes:
      label: User story
      description: Who wants this, what they want, and why.
      placeholder: As a <type of user>, I want <goal> so that <reason>.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Concrete, testable statements. The feature is done when all of these are true.
      placeholder: |
        - Given ..., when ..., then ...
        - ...
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Designs, edge cases, open questions, out of scope.
